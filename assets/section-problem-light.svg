<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 98"
     width="1200" height="98" role="img" aria-label="The gap between two good tools">
  <style>
    .rise  { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { transform: translateY(9px) } to { transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be123c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="98" rx="12" fill="#F6F8FA"/>
  <rect width="1200" height="98" rx="12" fill="url(#w)"/>
  <rect width="6" height="98" rx="3" fill="#be123c"/>
  <g class="rise">
  <text x="40" y="42" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.5"
        fill="#656D76">dbt and Power BI each have good lineage tools, and both stop at the warehouse boundary — the one place a column's story</text>
  <text x="40" y="68" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.5"
        fill="#656D76">crosses systems. Today that gap is crossed by hand.</text>
  </g>
</svg>
