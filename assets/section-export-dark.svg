<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 138"
     width="1200" height="138" role="img" aria-label="One file you can email">
  <style>
    .rise  { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { transform: translateY(9px) } to { transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }</style>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="138" rx="12" fill="#161B22"/>
  <rect width="1200" height="138" rx="12" fill="url(#w)"/>
  <rect width="6" height="138" rx="3" fill="#34d399"/>
  <g class="rise">
  <text x="40" y="42" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700"
        letter-spacing="1.6" fill="#34d399">EXPORT</text>
  <text x="40" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="29"
        font-weight="700" fill="#E6EDF3" letter-spacing="-0.4">One file you can email</text>
  <text x="40" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17.5"
        fill="#8B949E">The same graph, canvas and panels with the data baked in. No server and no sidecar assets — double-click it and it opens.</text>
  </g>
</svg>
