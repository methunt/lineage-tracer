<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340"
     width="1200" height="340" role="img" aria-label="Lineage Tracer">
  <style>
    /* Entrance animations move things but never fade them. A renderer that does
       not run CSS - GitHub's mobile app, an email digest, a PDF export - would
       otherwise show an empty banner, because the from-state of a fade is
       invisible and fill-mode `both` holds it for the whole delay. Every element
       here is fully legible with the animation stripped out. */
    .rise  { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { transform: translateY(9px) } to { transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    .sweep { animation: sweep .9s cubic-bezier(.2,.7,.3,1) .15s; }
    .blob  { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes sweep { from { width: 0 } to { width: 1120px } }
    @keyframes drift { from { transform: translate(0,0) }
                        to   { transform: translate(64px,-22px) } }
  </style>
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#4f46e5" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- The panel is painted in the theme's own card colour, the same one the
       section banners use, so the hero reads as a deliberate surface on all four
       GitHub backgrounds instead of borrowing whichever one is behind it. -->
  <rect width="1200" height="340" rx="16" fill="#F6F8FA"/>
  <rect width="1200" height="340" rx="16" fill="url(#w)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5"
        fill="none" stroke="#D0D7DE"/>
  <rect width="8" height="340" rx="4" fill="#4f46e5"/>
  <g class="blob"><circle cx="1010" cy="70" r="240" fill="url(#g)"/></g>
  <text class="rise" x="40" y="72" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700"
        letter-spacing="3" fill="#4f46e5">DBT  ⇄  POWER BI</text>
  <text class="rise" x="40" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="66" font-weight="800"
        fill="#1F2328" letter-spacing="-1.8">Lineage Tracer</text>
  <rect class="sweep" x="40" y="184" width="1120" height="2"
        rx="1" fill="#D0D7DE"/>
  <text class="rise" style="animation-delay:0.20s" x="40" y="218"
        font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#656D76">Trace a column from the dbt model that builds it to the Power BI visual that renders it — through</text>
  <text class="rise" style="animation-delay:0.25s" x="40" y="248"
        font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#656D76">Power Query renames, measures and calculation groups.</text>
  <g class="rise" style="animation-delay:0.85s">
    <rect x="40" y="278" width="49" height="32" rx="16"
          fill="#EEF1F5" stroke="#D0D7DE"/>
    <text x="65" y="299" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#656D76">dbt</text>
  </g>
  <g class="rise" style="animation-delay:0.92s">
    <rect x="99" y="278" width="167" height="32" rx="16"
          fill="#EEF1F5" stroke="#D0D7DE"/>
    <text x="183" y="299" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#656D76">Power BI  ·  PBIP</text>
  </g>
  <g class="rise" style="animation-delay:0.99s">
    <rect x="276" y="278" width="184" height="32" rx="16"
          fill="#EEF1F5" stroke="#D0D7DE"/>
    <text x="368" y="299" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#656D76">runs in the browser</text>
  </g>
  <g class="rise" style="animation-delay:1.06s">
    <rect x="470" y="278" width="108" height="32" rx="16"
          fill="#EEF1F5" stroke="#D0D7DE"/>
    <text x="524" y="299" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#656D76">no account</text>
  </g>
  <g class="rise" style="animation-delay:1.13s">
    <rect x="588" y="278" width="49" height="32" rx="16"
          fill="#EEF1F5" stroke="#D0D7DE"/>
    <text x="612" y="299" text-anchor="middle"
          font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#656D76">MIT</text>
  </g>
</svg>
