<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 152"
     width="1320" height="152" role="img" aria-label="Open Lineage Tracer">
  <style>
    .rise  { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { transform: translateY(9px) } to { transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    .sheen { animation: sheen 4.5s ease-in-out infinite 1.4s; }
    @keyframes sheen { from { transform: translateX(-260px) }
                        to   { transform: translateX(1320px) } }
    .nudge { animation: nudge 2.4s ease-in-out infinite; }
    @keyframes nudge { 0%,70%,100% { transform: translateX(0) }
                        85% { transform: translateX(9px) } }
  </style>
  <defs>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-60%" width="140%" height="260%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#fb7185"
                    flood-opacity="0.5"/>
    </filter>
    <clipPath id="clip"><rect x="150" y="14" width="1020" height="100" rx="28"/></clipPath>
    <linearGradient id="sheenfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g class="rise">
    <rect x="150" y="14" width="1020" height="100" rx="28" fill="url(#btn)" filter="url(#sh)"/>
    <rect x="150" y="14" width="1020" height="100" rx="28" fill="url(#gloss)"/>
    <rect x="151" y="15" width="1018" height="98" rx="27"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.30"/>
    <g clip-path="url(#clip)">
      <rect class="sheen" x="150" y="14" width="190" height="100" fill="url(#sheenfade)"/>
    </g>
    <!-- Font sizes look oversized in the source because the asset is drawn at
         1320 and displayed at width="660" - halve them to judge the result. -->
    <g class="nudge">
      <circle cx="212" cy="64" r="30" fill="#FFFFFF" fill-opacity="0.18"/>
      <path d="M 200 50 L 228 64 L 200 78 Z" fill="#FFFFFF"/>
    </g>
    <text x="268" y="58" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.6">Open Lineage Tracer</text>
    <text x="268" y="92" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23"
          fill="#FFFFFF" opacity="0.88">runs in your browser  ·  no account  ·  nothing is uploaded</text>
    <g class="nudge">
      <path d="M 1074 64 h 46 m -18 -17 l 18 17 l -18 17" fill="none"
            stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
